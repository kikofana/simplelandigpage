<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buscador de implantes</title>
<style>
:root {
  --fondo: #f4f5f7;
  --superficie: #ffffff;
  --borde: #d8dbe0;
  --texto: #1a1d21;
  --texto-suave: #666d78;
  --acento: #1b5e8c;
  --acento-suave: #e8f1f7;
  --aviso-fondo: #fff4e0;
  --aviso-borde: #e0a838;
  --aviso-texto: #6b4a05;
  --implante: #b8d4e6;
  --implante-borde: #1b5e8c;
  --cota: #99a0ab;
  --radio: 8px;
  /* Tres colores para la comparación, distinguibles también en escala de
     grises: azul medio, ámbar, verde azulado. */
  --comp-1: #1b5e8c;
  --comp-2: #c2701a;
  --comp-3: #1d7a6c;
}

/* El tema tiene tres estados, no dos: una elección explícita marca la raíz con
   data-theme, y el ajuste "sistema" no marca nada. Por eso el bloque oscuro
   aparece dos veces: una tras prefers-color-scheme (excluyendo una elección
   explícita de claro) y otra tras data-theme="dark". */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fondo: #16181c;
    --superficie: #1f2227;
    --borde: #343941;
    --texto: #e8eaed;
    --texto-suave: #9aa1ac;
    --acento: #6fb3dd;
    --acento-suave: #1c2b36;
    --aviso-fondo: #2a2314;
    --aviso-borde: #b8892c;
    --aviso-texto: #e8c477;
    --implante: #2c4757;
    --implante-borde: #6fb3dd;
    --cota: #6b7280;
    --comp-1: #6fb3dd;
    --comp-2: #e0a44a;
    --comp-3: #5ac0ac;
  }
}

:root[data-theme="dark"] {
  --fondo: #16181c;
  --superficie: #1f2227;
  --borde: #343941;
  --texto: #e8eaed;
  --texto-suave: #9aa1ac;
  --acento: #6fb3dd;
  --acento-suave: #1c2b36;
  --aviso-fondo: #2a2314;
  --aviso-borde: #b8892c;
  --aviso-texto: #e8c477;
  --implante: #2c4757;
  --implante-borde: #6fb3dd;
  --cota: #6b7280;
  --comp-1: #6fb3dd;
  --comp-2: #e0a44a;
  --comp-3: #5ac0ac;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 0 16px 48px;
  background: var(--fondo);
  color: var(--texto);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}

.cabecera {
  max-width: 1100px;
  margin: 0 auto;
  padding-block: 28px 16px;
}

h1 {
  margin: 0;
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.subtitulo {
  margin: 4px 0 0;
  color: var(--texto-suave);
  font-size: 14px;
}

.aviso-demo {
  max-width: 1100px;
  margin: 0 auto 20px;
  padding: 12px 16px;
  background: var(--aviso-fondo);
  border: 1px solid var(--aviso-borde);
  border-left-width: 4px;
  border-radius: var(--radio);
  color: var(--aviso-texto);
  font-size: 14px;
}

main { max-width: 1100px; margin: 0 auto; }

.panel {
  background: var(--superficie);
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  padding: 18px;
}

.campos {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
}

.campo { display: flex; flex-direction: column; gap: 5px; min-width: 130px; }
.campo-principal { min-width: 160px; }

.campo label {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--texto-suave);
}

.con-unidad {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--fondo);
  border: 1px solid var(--borde);
  border-radius: 6px;
  padding: 0 10px;
}

.con-unidad:focus-within { border-color: var(--acento); }

.con-unidad input {
  border: none;
  background: none;
  color: var(--texto);
  font: 600 20px/1 ui-monospace, "SF Mono", Menlo, monospace;
  font-variant-numeric: tabular-nums;
  padding: 9px 0;
  width: 100%;
  min-width: 0;
}

.con-unidad input:focus { outline: none; }
.con-unidad:focus-within { outline: 2px solid var(--acento); outline-offset: 1px; }
select:focus-visible, .chip:focus-within { outline: 2px solid var(--acento); outline-offset: 1px; }
.unidad, .prefijo, .separador { color: var(--texto-suave); font-size: 14px; flex: none; }

/* --- Deslizador de volumen ---
   Dos inputs range superpuestos sobre una pista dibujada. Los inputs no
   reciben el puntero salvo en sus asas, para que el de abajo siga siendo
   agarrable donde el de arriba no tiene asa. */

.campo-rango { min-width: 210px; justify-content: flex-start; }

.lectura {
  text-transform: none;
  letter-spacing: 0;
  font-weight: 400;
  color: var(--texto-suave);
}

.lectura.activo { color: var(--acento); font-weight: 600; }

.rango {
  position: relative;
  height: 34px;
  display: flex;
  align-items: center;
}

.rango-pista {
  position: absolute;
  left: 8px; right: 8px;
  height: 4px;
  background: var(--borde);
  border-radius: 2px;
}

.rango-relleno {
  position: absolute;
  top: 0; bottom: 0;
  background: var(--acento);
  border-radius: 2px;
}

.rango input[type="range"] {
  position: absolute;
  left: 0; right: 0;
  width: 100%;
  margin: 0;
  background: none;
  pointer-events: none;
  -webkit-appearance: none;
  appearance: none;
}

.rango input[type="range"]::-webkit-slider-runnable-track {
  background: none;
  height: 16px;
}

.rango input[type="range"]::-moz-range-track { background: none; height: 16px; }

.rango input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  pointer-events: auto;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--superficie);
  border: 2px solid var(--acento);
  box-shadow: 0 1px 3px rgb(0 0 0 / 0.25);
  cursor: grab;
}

.rango input[type="range"]::-moz-range-thumb {
  pointer-events: auto;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--superficie);
  border: 2px solid var(--acento);
  box-shadow: 0 1px 3px rgb(0 0 0 / 0.25);
  cursor: grab;
}

.rango input[type="range"]:active::-webkit-slider-thumb { cursor: grabbing; }
.rango input[type="range"]:focus-visible::-webkit-slider-thumb {
  outline: 2px solid var(--acento);
  outline-offset: 2px;
}
.rango input[type="range"]:focus-visible::-moz-range-thumb {
  outline: 2px solid var(--acento);
  outline-offset: 2px;
}
.rango input[type="range"]:focus { outline: none; }

select {
  background: var(--fondo);
  border: 1px solid var(--borde);
  border-radius: 6px;
  color: var(--texto);
  font-size: 14px;
  padding: 10px 8px;
  min-width: 130px;
}

.marcas { border: none; margin: 16px 0 0; padding: 0; }

.marcas legend {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--texto-suave);
  padding: 0 0 7px;
}

.chips { display: flex; flex-wrap: wrap; gap: 8px; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--fondo);
  border: 1px solid var(--borde);
  border-radius: 999px;
  padding: 6px 13px 6px 10px;
  font-size: 14px;
  cursor: pointer;
  user-select: none;
}

.chip:has(input:checked) {
  background: var(--acento-suave);
  border-color: var(--acento);
  color: var(--acento);
  font-weight: 500;
}

.chip input { accent-color: var(--acento); margin: 0; }

/* --- Comparación --- */

.comparador {
  margin-top: 20px;
  background: var(--superficie);
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  padding: 16px 18px 18px;
}

.comparador-cabecera {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 4px;
}

.comparador-cabecera h2 {
  margin: 0;
  font-size: 13px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--texto-suave);
}

.boton-texto {
  background: none;
  border: none;
  color: var(--acento);
  font: inherit;
  font-size: 13px;
  cursor: pointer;
  padding: 2px 4px;
  border-radius: 4px;
}

.boton-texto:hover { text-decoration: underline; }
.boton-texto:focus-visible { outline: 2px solid var(--acento); outline-offset: 1px; }

.comparador-cuerpo {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 24px;
}

.comparador-esquemas {
  display: flex;
  gap: 20px;
  align-items: center;
  flex: none;
}

.comparador-tabla { flex: 1 1 320px; overflow-x: auto; }

.comparador-tabla table {
  border-collapse: collapse;
  width: 100%;
  font-size: 14px;
}

.comparador-tabla th,
.comparador-tabla td {
  text-align: left;
  padding: 6px 12px 6px 0;
  border-bottom: 1px solid var(--borde);
  white-space: nowrap;
}

.comparador-tabla tbody th {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--texto-suave);
}

.comparador-tabla td {
  font: 600 15px/1.3 ui-monospace, "SF Mono", Menlo, monospace;
  font-variant-numeric: tabular-nums;
}

/* Arriba, no abajo: si un subtítulo ocupa tres líneas y otro una, alinear por
   abajo descoloca los puntos de color y las referencias entre columnas. */
.comparador-tabla thead th { vertical-align: top; padding-bottom: 9px; }
.comparador-tabla .ref { display: block; font: 600 14px/1.3 ui-monospace, Menlo, monospace; }
.comparador-tabla .sub { display: block; font-size: 11px; font-weight: 400; color: var(--texto-suave); white-space: normal; max-width: 22ch; }

.punto {
  display: inline-block;
  width: 9px; height: 9px;
  border-radius: 50%;
  margin-bottom: 3px;
}

.oculto {
  position: absolute;
  width: 1px; height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
}

.comparar {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 13px;
  color: var(--texto-suave);
  cursor: pointer;
  user-select: none;
}

.comparar input { accent-color: var(--acento); margin: 0; cursor: pointer; }
.comparar:has(input:checked) { color: var(--comp, var(--acento)); font-weight: 500; }
.comparar.lleno { opacity: 0.45; cursor: default; }
.comparar.lleno input { cursor: default; }
.comparar:focus-within { outline: 2px solid var(--acento); outline-offset: 3px; border-radius: 3px; }

.tarjeta.comparada { border-color: var(--comp); box-shadow: inset 3px 0 0 var(--comp); }

.resumen {
  margin: 22px 0 12px;
  color: var(--texto-suave);
  font-size: 14px;
}

.resumen strong { color: var(--texto); }

.resultados {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
  gap: 14px;
}

.tarjeta {
  background: var(--superficie);
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.tarjeta.exacta { border-color: var(--acento); box-shadow: inset 3px 0 0 var(--acento); }

.tarjeta-cabecera { display: flex; justify-content: space-between; gap: 10px; align-items: start; }

.marca-linea { font-weight: 600; font-size: 15px; }
.referencia {
  color: var(--texto-suave);
  font: 13px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
  margin-top: 2px;
}

.delta {
  flex: none;
  font: 600 12px/1 ui-monospace, Menlo, monospace;
  padding: 5px 8px;
  border-radius: 999px;
  background: var(--fondo);
  color: var(--texto-suave);
  white-space: nowrap;
}

.delta.cero { background: var(--acento-suave); color: var(--acento); }

.etiquetas { display: flex; flex-wrap: wrap; gap: 6px; }

.etiqueta {
  font-size: 12px;
  padding: 3px 9px;
  border-radius: 4px;
  background: var(--fondo);
  border: 1px solid var(--borde);
  color: var(--texto-suave);
}

.etiqueta.perfil { background: var(--acento-suave); border-color: transparent; color: var(--acento); font-weight: 500; }

.esquemas { display: flex; gap: 18px; justify-content: center; align-items: flex-end; padding: 4px 0; }
.esquema { text-align: center; margin: 0; }
.esquema svg { display: block; margin: 0 auto; }
.esquema figcaption { font-size: 11px; color: var(--texto-suave); margin-top: 3px; }

.medidas {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px 8px;
  border-top: 1px solid var(--borde);
  padding-top: 12px;
}

.medida { display: flex; flex-direction: column; gap: 1px; }

.medida dt {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--texto-suave);
}

.medida dd {
  margin: 0;
  font: 600 16px/1.2 ui-monospace, "SF Mono", Menlo, monospace;
  font-variant-numeric: tabular-nums;
}

.medida dd .u { font-size: 11px; font-weight: 400; color: var(--texto-suave); }
.medida dd.vacio { color: var(--texto-suave); font-weight: 400; }

.fuente {
  font-size: 11px;
  color: var(--texto-suave);
  border-top: 1px solid var(--borde);
  padding-top: 9px;
  line-height: 1.45;
}

.vacio-total {
  grid-column: 1 / -1;
  text-align: center;
  padding: 48px 20px;
  color: var(--texto-suave);
  background: var(--superficie);
  border: 1px dashed var(--borde);
  border-radius: var(--radio);
}

.pie {
  max-width: 1100px;
  margin: 36px auto 0;
  padding-top: 16px;
  border-top: 1px solid var(--borde);
  color: var(--texto-suave);
  font-size: 12px;
}

@media (max-width: 520px) {
  .campo, .campo-principal { min-width: 100%; }
  .resultados { grid-template-columns: 1fr; }
}

</style>
</head>
<body>
<header class="cabecera">
  <h1>Buscador de implantes</h1>
  <p class="subtitulo">Búsqueda por base mamaria con tolerancia</p>
</header>

<div id="avisoDemo" class="aviso-demo" hidden>
  <strong>Revisar los datos.</strong>
  <span id="avisoDemoTexto"></span>
</div>

<main>
  <section class="panel" aria-label="Criterios de búsqueda">
    <div class="campos">
      <div class="campo campo-principal">
        <label for="base">Base de la paciente</label>
        <div class="con-unidad">
          <input type="number" id="base" value="11" step="0.1" min="6" max="18" inputmode="decimal">
          <span class="unidad">cm</span>
        </div>
      </div>

      <div class="campo">
        <label for="tolerancia">Tolerancia</label>
        <div class="con-unidad">
          <span class="prefijo">±</span>
          <input type="number" id="tolerancia" value="0.5" step="0.1" min="0" max="3" inputmode="decimal">
          <span class="unidad">cm</span>
        </div>
      </div>

      <div class="campo campo-rango">
        <label for="volMin">Volumen <span id="volLectura" class="lectura"></span></label>
        <div class="rango">
          <div class="rango-pista"><div class="rango-relleno" id="rangoRelleno"></div></div>
          <input type="range" id="volMin" step="5" aria-label="Volumen mínimo">
          <input type="range" id="volMax" step="5" aria-label="Volumen máximo">
        </div>
      </div>

      <div class="campo">
        <label for="proyeccion">Proyección</label>
        <select id="proyeccion">
          <option value="">Todas</option>
          <option value="baja">Baja</option>
          <option value="media">Media</option>
          <option value="alta">Alta</option>
        </select>
      </div>

      <div class="campo">
        <label for="forma">Forma</label>
        <select id="forma">
          <option value="">Todas</option>
          <option value="redonda">Redonda</option>
          <option value="anatomica">Anatómica</option>
        </select>
      </div>

      <div class="campo" id="campoAltura" hidden>
        <label for="altura">Altura</label>
        <select id="altura">
          <option value="">Todas</option>
          <option value="baja">Baja</option>
          <option value="media">Media</option>
          <option value="alta">Alta</option>
        </select>
      </div>

      <div class="campo">
        <label for="superficie">Superficie</label>
        <select id="superficie">
          <option value="">Todas</option>
        </select>
      </div>

      <div class="campo">
        <label for="orden">Ordenar por</label>
        <select id="orden">
          <option value="cercania">Cercanía a la base</option>
          <option value="volumen">Volumen</option>
          <option value="proyeccion">Proyección</option>
        </select>
      </div>
    </div>

    <fieldset class="marcas">
      <legend>Marcas</legend>
      <div id="listaMarcas" class="chips"></div>
    </fieldset>
  </section>

  <section id="comparador" class="comparador" aria-label="Comparación" hidden>
    <div class="comparador-cabecera">
      <h2>Comparación</h2>
      <button type="button" id="limpiarComparacion" class="boton-texto">Vaciar</button>
    </div>
    <div class="comparador-cuerpo">
      <div id="comparadorEsquemas" class="comparador-esquemas"></div>
      <div id="comparadorTabla" class="comparador-tabla"></div>
    </div>
  </section>

  <p id="resumen" class="resumen" role="status"></p>
  <div id="resultados" class="resultados"></div>
</main>

<footer class="pie">
  Herramienta interna de consulta. Cada medida debe contrastarse con el catálogo
  del fabricante antes de usarse en planificación quirúrgica.
</footer>

<script>
// Buscador de implantes por base mamaria.
// Los datos vienen de datos.js (const IMPLANTES), generado por construir.py.

// Escala fija en px/cm: cada esquema ocupa justo lo que mide su implante, así
// dos tarjetas se pueden comparar visualmente sin leer los números.
const ESCALA = 8;
const PAD_SUP = 8;
const PAD_INF = 26;   // hueco para la cota inferior
const CLAVE_ESTADO = "buscador-implantes-v1";

const $ = (id) => document.getElementById(id);

const el = {
  base: $("base"),
  tolerancia: $("tolerancia"),
  volMin: $("volMin"),
  volMax: $("volMax"),
  volLectura: $("volLectura"),
  rangoRelleno: $("rangoRelleno"),
  proyeccion: $("proyeccion"),
  forma: $("forma"),
  campoAltura: $("campoAltura"),
  altura: $("altura"),
  superficie: $("superficie"),
  orden: $("orden"),
  listaMarcas: $("listaMarcas"),
  comparador: $("comparador"),
  comparadorEsquemas: $("comparadorEsquemas"),
  comparadorTabla: $("comparadorTabla"),
  limpiarComparacion: $("limpiarComparacion"),
  resumen: $("resumen"),
  resultados: $("resultados"),
  avisoDemo: $("avisoDemo"),
  avisoDemoTexto: $("avisoDemoTexto"),
};

const unicos = (campo) => [...new Set(IMPLANTES.map((i) => i[campo]))].sort();
const num = (n, dec = 1) => n.toFixed(dec).replace(".", ",");

// Cada marca nombra la proyección a su manera y los nombres no se traducen
// entre sí, así que el grupo se calcula del índice (proyección ÷ base), que sí
// es comparable. Los dos cortes caen en huecos reales del catálogo: entre 0,370
// y 0,407 no hay ningún implante, y entre 0,445 y 0,456 tampoco. Cada perfil de
// cada marca cae entero en un grupo, salvo el CPG 313 de Mentor, que se reparte.
const CORTE_MEDIA = 0.39;
const CORTE_ALTA = 0.45;

const indiceProyeccion = (imp) => imp.proyeccionCm / imp.baseCm;

function grupoProyeccion(imp) {
  const i = indiceProyeccion(imp);
  if (i < CORTE_MEDIA) return "baja";
  return i < CORTE_ALTA ? "media" : "alta";
}

// La altura se agrupa igual, del índice altura ÷ base, y por el mismo motivo:
// que siga funcionando cuando entren anatómicas de una marca que no use la
// nomenclatura de Mentor. Los cortes caen en huecos del catálogo (entre 0,944 y
// 1,019 no hay nada) y reproducen las etiquetas de las CPG en las 121 filas.
const ALTURA_MEDIA = 0.91;
const ALTURA_ALTA = 0.98;

function grupoAltura(imp) {
  const i = imp.alturaCm / imp.baseCm;
  if (i < ALTURA_MEDIA) return "baja";
  return i < ALTURA_ALTA ? "media" : "alta";
}

// El CSV guarda los valores sin tildes para no complicar la edición a mano;
// al mostrarlos se acentúan.
const ACENTOS = { anatomica: "Anatómica" };
const cap = (s) => ACENTOS[s] || s.charAt(0).toUpperCase() + s.slice(1);

// --- Esquemas ---------------------------------------------------------------
// Se dibujan a partir de las medidas de cada fila, así el esquema nunca puede
// contradecir a la tabla.

function cota(x1, y1, x2, y2, texto, anclaX, anclaY, rotar) {
  const tope = 3;
  const vertical = x1 === x2;
  const marcas = vertical
    ? `<path d="M${x1 - tope},${y1} H${x1 + tope} M${x2 - tope},${y2} H${x2 + tope}"/>`
    : `<path d="M${x1},${y1 - tope} V${y1 + tope} M${x2},${y2 - tope} V${y2 + tope}"/>`;
  const transform = rotar ? ` transform="rotate(-90 ${anclaX} ${anclaY})"` : "";
  return `<g class="cota" stroke="var(--cota)" stroke-width="1" fill="none">
      <path d="M${x1},${y1} L${x2},${y2}"/>${marcas}
    </g>
    <text x="${anclaX}" y="${anclaY}" text-anchor="middle" font-size="9"
      fill="var(--cota)" font-family="ui-monospace, Menlo, monospace"${transform}>${texto}</text>`;
}

function vistaFrontal({ baseCm, alturaCm }) {
  const ancho = baseCm * ESCALA;
  const alto = alturaCm * ESCALA;
  const padIzq = 4;
  const padDer = 32;             // hueco para la cota de altura
  const w = ancho + padIzq + padDer;
  const h = alto + PAD_SUP + PAD_INF;

  const izq = padIzq;
  const der = padIzq + ancho;
  const cx = padIzq + ancho / 2;
  const cy = PAD_SUP + alto / 2;
  const abajo = PAD_SUP + alto;

  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img"
      aria-label="Vista frontal: base ${num(baseCm)} por ${num(alturaCm)} centímetros">
    <ellipse cx="${cx}" cy="${cy}" rx="${ancho / 2}" ry="${alto / 2}"
      fill="var(--implante)" stroke="var(--implante-borde)" stroke-width="1.5"/>
    ${cota(izq, abajo + 11, der, abajo + 11, num(baseCm), cx, abajo + 22, false)}
    ${cota(der + 11, PAD_SUP, der + 11, abajo, num(alturaCm), der + 21, cy, true)}
  </svg>`;
}

// Silueta de perfil. En anatómica el punto de máxima proyección cae en el polo
// inferior y el superior se afina; en redonda es una cúpula simétrica.
function perfilPath(x0, yTop, alto, proy, anatomica) {
  const yBot = yTop + alto;
  const apexY = yTop + alto * (anatomica ? 0.68 : 0.5);
  const apexX = x0 + proy;
  const dArriba = (apexY - yTop) * 0.78;
  const dAbajo = (yBot - apexY) * 0.78;
  // Cuánto se separa la curva de la pared torácica al arrancar: si el polo
  // superior sale recto hacia fuera, la anatómica se ve como una cúpula.
  const salidaSup = proy * (anatomica ? 0.30 : 0.72);
  const salidaInf = proy * (anatomica ? 0.50 : 0.62);

  return `M${x0},${yTop}
    C${x0 + salidaSup},${yTop} ${apexX},${apexY - dArriba} ${apexX},${apexY}
    C${apexX},${apexY + dAbajo} ${x0 + salidaInf},${yBot} ${x0},${yBot} Z`;
}

function vistaLateral({ alturaCm, proyeccionCm, forma }) {
  const alto = alturaCm * ESCALA;
  const proy = proyeccionCm * ESCALA;
  const padIzq = 8;
  const padDer = 10;
  const w = proy + padIzq + padDer;
  const h = alto + PAD_SUP + PAD_INF;

  const x0 = padIzq;             // pared torácica
  const yTop = PAD_SUP;
  const yBot = yTop + alto;
  const apexX = x0 + proy;
  const perfil = perfilPath(x0, yTop, alto, proy, forma === "anatomica");

  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img"
      aria-label="Vista lateral: proyección ${num(proyeccionCm)} centímetros">
    <path d="M${x0},${yTop - 5} V${yBot + 5}" stroke="var(--cota)" stroke-width="1.5"
      stroke-dasharray="3 2" fill="none"/>
    <path d="${perfil}" fill="var(--implante)" stroke="var(--implante-borde)" stroke-width="1.5"/>
    ${cota(x0, yBot + 11, apexX, yBot + 11, num(proyeccionCm), x0 + proy / 2, yBot + 22, false)}
  </svg>`;
}

// --- Tarjeta ----------------------------------------------------------------

function medida(etiqueta, valor, unidad) {
  if (valor == null) {
    return `<div class="medida"><dt>${etiqueta}</dt><dd class="vacio">—</dd></div>`;
  }
  return `<div class="medida"><dt>${etiqueta}</dt>
    <dd>${valor}<span class="u"> ${unidad}</span></dd></div>`;
}

function tarjeta(imp, objetivo) {
  const delta = imp.baseCm - objetivo;
  const exacta = Math.abs(delta) < 0.001;
  const signo = delta > 0 ? "+" : delta < 0 ? "−" : "";
  const indice = indiceProyeccion(imp);

  const id = idDe(imp);
  const puesto = seleccion.indexOf(id);
  const comparada = puesto !== -1;
  const lleno = seleccion.length >= MAX_COMPARAR && !comparada;

  const fuente = [imp.catalogo, imp.pagina ? `p. ${imp.pagina}` : null]
    .filter(Boolean).join(" · ");

  return `<article class="tarjeta${exacta ? " exacta" : ""}${comparada ? " comparada" : ""}"
      ${comparada ? `style="--comp: var(--comp-${puesto + 1})"` : ""}>
    <div class="tarjeta-cabecera">
      <div>
        <div class="marca-linea">${imp.marca} · ${imp.linea}</div>
        <div class="referencia">${imp.referencia}</div>
      </div>
      <span class="delta${exacta ? " cero" : ""}">
        ${exacta ? "exacta" : `${signo}${num(Math.abs(delta), 1)}`}
      </span>
    </div>

    <label class="comparar${lleno ? " lleno" : ""}">
      <input type="checkbox" data-id="${id}"${comparada ? " checked" : ""}${lleno ? " disabled" : ""}>
      ${comparada ? "En la comparación" : lleno ? `Máximo ${MAX_COMPARAR}` : "Comparar"}
    </label>

    <div class="etiquetas">
      <span class="etiqueta perfil">${imp.perfilMarca}</span>
      <span class="etiqueta">${cap(imp.forma)}</span>
      <span class="etiqueta">${imp.superficieMarca
        ? `${imp.superficieMarca} · ${imp.superficie}`
        : cap(imp.superficie)}</span>
      ${imp.gel ? `<span class="etiqueta">${imp.gel}</span>` : ""}
    </div>

    <div class="esquemas">
      <figure class="esquema">${vistaFrontal(imp)}<figcaption>Frontal</figcaption></figure>
      <figure class="esquema">${vistaLateral(imp)}<figcaption>Lateral</figcaption></figure>
    </div>

    <dl class="medidas">
      ${medida("Base", num(imp.baseCm), "cm")}
      ${medida("Altura", num(imp.alturaCm), "cm")}
      ${medida("Proyección", num(imp.proyeccionCm), "cm")}
      ${medida("Arco", imp.arcoCm == null ? null : num(imp.arcoCm), "cm")}
      ${medida("Volumen", num(imp.volumenCc, 0), "cc")}
      ${medida("Índice", num(indice, 2), grupoProyeccion(imp))}
    </dl>

    <div class="fuente">
      ${fuente}${imp.notas ? ` — ${imp.notas}` : ""}
    </div>
  </article>`;
}

// --- Deslizador de volumen --------------------------------------------------
// Dos <input type="range"> superpuestos: cada asa sigue siendo un control real,
// así que el teclado funciona sin escribir nada a mano. Se obliga a que queden
// separadas al menos un paso para que nunca se solapen del todo, que es cuando
// una taparía a la otra y ya no habría forma de volver a cogerla.

const PASO_VOL = 5;
let VOL_MIN = 0;
let VOL_MAX = 0;

function iniciarRangoVolumen() {
  const vols = IMPLANTES.map((i) => i.volumenCc);
  VOL_MIN = Math.floor(Math.min(...vols) / PASO_VOL) * PASO_VOL;
  VOL_MAX = Math.ceil(Math.max(...vols) / PASO_VOL) * PASO_VOL;

  for (const campo of [el.volMin, el.volMax]) {
    campo.min = VOL_MIN;
    campo.max = VOL_MAX;
    campo.step = PASO_VOL;
  }
  el.volMin.value = VOL_MIN;
  el.volMax.value = VOL_MAX;
}

function ajustarAsas(movida) {
  let min = Number(el.volMin.value);
  let max = Number(el.volMax.value);

  if (min > max - PASO_VOL) {
    if (movida === "min") min = max - PASO_VOL;
    else max = min + PASO_VOL;
    el.volMin.value = Math.max(VOL_MIN, min);
    el.volMax.value = Math.min(VOL_MAX, max);
  }
  return { min: Number(el.volMin.value), max: Number(el.volMax.value) };
}

function pintarRangoVolumen({ min, max }) {
  const span = VOL_MAX - VOL_MIN;
  el.rangoRelleno.style.left = `${((min - VOL_MIN) / span) * 100}%`;
  el.rangoRelleno.style.right = `${((VOL_MAX - max) / span) * 100}%`;

  const completo = min === VOL_MIN && max === VOL_MAX;
  el.volLectura.textContent = completo
    ? `todos (${VOL_MIN}–${VOL_MAX} cc)`
    : `${min}–${max} cc`;
  el.volLectura.classList.toggle("activo", !completo);
}

// --- Comparación ------------------------------------------------------------
// Hasta tres, superpuestas a la misma escala: es donde se ve de un vistazo la
// diferencia entre proyecciones que en la tabla son dos decimales.

const MAX_COMPARAR = 3;
const ESCALA_COMP = 13;
let seleccion = [];   // ids, en el orden en que se marcaron

const idDe = (imp) => `${imp.marca}|${imp.referencia}`;
const implantePorId = (id) => IMPLANTES.find((i) => idDe(i) === id);

function alternarComparacion(id) {
  if (seleccion.includes(id)) seleccion = seleccion.filter((x) => x !== id);
  else if (seleccion.length < MAX_COMPARAR) seleccion = [...seleccion, id];
  buscar();
}

function superposicionFrontal(imps) {
  const anchoMax = Math.max(...imps.map((i) => i.baseCm)) * ESCALA_COMP;
  const altoMax = Math.max(...imps.map((i) => i.alturaCm)) * ESCALA_COMP;
  const pad = 10;
  const w = anchoMax + pad * 2;
  const h = altoMax + pad * 2;

  const formas = imps.map((imp, n) => {
    const rx = (imp.baseCm * ESCALA_COMP) / 2;
    const ry = (imp.alturaCm * ESCALA_COMP) / 2;
    return `<ellipse cx="${w / 2}" cy="${h / 2}" rx="${rx}" ry="${ry}"
      fill="var(--comp-${n + 1})" fill-opacity="0.16"
      stroke="var(--comp-${n + 1})" stroke-width="2"/>`;
  }).join("");

  return `<figure class="esquema">
    <svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img"
      aria-label="Superposición frontal de los implantes seleccionados">${formas}</svg>
    <figcaption>Frontal</figcaption></figure>`;
}

function superposicionLateral(imps) {
  const altoMax = Math.max(...imps.map((i) => i.alturaCm)) * ESCALA_COMP;
  const proyMax = Math.max(...imps.map((i) => i.proyeccionCm)) * ESCALA_COMP;
  const pad = 10;
  const w = proyMax + pad * 2;
  const h = altoMax + pad * 2;
  const x0 = pad;

  // Centradas verticalmente y apoyadas en la misma pared torácica, para que la
  // comparación sea de proyección y de altura, no de dónde se apoyan.
  const formas = imps.map((imp, n) => {
    const alto = imp.alturaCm * ESCALA_COMP;
    const proy = imp.proyeccionCm * ESCALA_COMP;
    const yTop = (h - alto) / 2;
    return `<path d="${perfilPath(x0, yTop, alto, proy, imp.forma === "anatomica")}"
      fill="var(--comp-${n + 1})" fill-opacity="0.16"
      stroke="var(--comp-${n + 1})" stroke-width="2"/>`;
  }).join("");

  return `<figure class="esquema">
    <svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img"
      aria-label="Superposición lateral de los implantes seleccionados">
      <path d="M${x0},${pad / 2} V${h - pad / 2}" stroke="var(--cota)" stroke-width="1.5"
        stroke-dasharray="3 2" fill="none"/>${formas}</svg>
    <figcaption>Lateral</figcaption></figure>`;
}

function renderComparador() {
  const imps = seleccion.map(implantePorId).filter(Boolean);

  if (!imps.length) {
    el.comparador.hidden = true;
    el.comparadorEsquemas.innerHTML = "";
    el.comparadorTabla.innerHTML = "";
    return;
  }
  el.comparador.hidden = false;

  el.comparadorEsquemas.innerHTML =
    superposicionFrontal(imps) + superposicionLateral(imps);

  const filas = [
    ["Base", (i) => `${num(i.baseCm)} cm`],
    ["Altura", (i) => `${num(i.alturaCm)} cm`],
    ["Proyección", (i) => `${num(i.proyeccionCm)} cm`],
    ["Arco", (i) => (i.arcoCm == null ? "—" : `${num(i.arcoCm)} cm`)],
    ["Volumen", (i) => `${num(i.volumenCc, 0)} cc`],
    ["Índice", (i) => `${num(indiceProyeccion(i), 2)} · ${grupoProyeccion(i)}`],
    ["Forma", (i) => cap(i.forma)],
    ["Superficie", (i) => i.superficieMarca || cap(i.superficie)],
  ];

  el.comparadorTabla.innerHTML = `<table>
    <thead><tr><th><span class="oculto">Medida</span></th>
      ${imps.map((i, n) => `<th>
        <span class="punto" style="background: var(--comp-${n + 1})"></span>
        <span class="ref">${i.referencia}</span>
        <span class="sub">${i.marca} · ${i.perfilMarca}</span>
      </th>`).join("")}
    </tr></thead>
    <tbody>${filas.map(([etiqueta, valor]) => `<tr>
      <th scope="row">${etiqueta}</th>
      ${imps.map((i) => `<td>${valor(i)}</td>`).join("")}
    </tr>`).join("")}</tbody>
  </table>`;
}

// --- Búsqueda ---------------------------------------------------------------

function marcasSeleccionadas() {
  return [...el.listaMarcas.querySelectorAll("input:checked")].map((i) => i.value);
}

function buscar() {
  const objetivo = parseFloat(el.base.value);
  const tol = parseFloat(el.tolerancia.value);

  if (!Number.isFinite(objetivo) || !Number.isFinite(tol)) {
    el.resumen.textContent = "Introduce una base y una tolerancia válidas.";
    el.resultados.innerHTML = "";
    return;
  }

  const min = objetivo - tol;
  const max = objetivo + tol;
  const marcas = marcasSeleccionadas();

  const vol = { min: Number(el.volMin.value), max: Number(el.volMax.value) };
  pintarRangoVolumen(vol);

  // La sub-selección de altura solo tiene sentido en anatómicas: en una redonda
  // la altura es la base y todas caerían en el mismo grupo.
  const soloAnatomicas = el.forma.value === "anatomica";
  el.campoAltura.hidden = !soloAnatomicas;
  if (!soloAnatomicas) el.altura.value = "";

  const encontrados = IMPLANTES.filter((i) =>
    i.baseCm >= min - 0.001 &&
    i.baseCm <= max + 0.001 &&
    marcas.includes(i.marca) &&
    i.volumenCc >= vol.min &&
    i.volumenCc <= vol.max &&
    (!el.proyeccion.value || grupoProyeccion(i) === el.proyeccion.value) &&
    (!el.forma.value || i.forma === el.forma.value) &&
    (!el.altura.value || grupoAltura(i) === el.altura.value) &&
    (!el.superficie.value || i.superficie === el.superficie.value)
  );

  const criterio = el.orden.value;
  encontrados.sort((a, b) => {
    if (criterio === "volumen") return a.volumenCc - b.volumenCc;
    if (criterio === "proyeccion") return a.proyeccionCm - b.proyeccionCm;
    const da = Math.abs(a.baseCm - objetivo);
    const db = Math.abs(b.baseCm - objetivo);
    return da !== db ? da - db : a.volumenCc - b.volumenCc;
  });

  const criterios = [`base entre <strong>${num(min)}–${num(max)} cm</strong>`];
  if (vol.min > VOL_MIN || vol.max < VOL_MAX) {
    criterios.push(`volumen <strong>${vol.min}–${vol.max} cc</strong>`);
  }
  if (el.proyeccion.value) criterios.push(`proyección <strong>${el.proyeccion.value}</strong>`);
  if (el.altura.value) criterios.push(`altura <strong>${el.altura.value}</strong>`);
  const filtros = criterios.join(", ");

  el.resumen.innerHTML = encontrados.length
    ? `<strong>${encontrados.length}</strong> ${encontrados.length === 1 ? "opción" : "opciones"} con ${filtros}`
    : `Ninguna opción con ${filtros}.`;

  el.resultados.innerHTML = encontrados.length
    ? encontrados.map((i) => tarjeta(i, objetivo)).join("")
    : `<p class="vacio-total">Prueba a ampliar la tolerancia o a quitar filtros.</p>`;

  renderComparador();
  guardarEstado();
}

// --- Estado (comodidad, no dato crítico) ------------------------------------

function guardarEstado() {
  try {
    localStorage.setItem(CLAVE_ESTADO, JSON.stringify({
      base: el.base.value,
      tolerancia: el.tolerancia.value,
      volMin: el.volMin.value,
      volMax: el.volMax.value,
      proyeccion: el.proyeccion.value,
      forma: el.forma.value,
      altura: el.altura.value,
      superficie: el.superficie.value,
      orden: el.orden.value,
      marcas: marcasSeleccionadas(),
    }));
  } catch { /* modo privado o almacenamiento bloqueado: se ignora */ }
}

function leerEstado() {
  try {
    return JSON.parse(localStorage.getItem(CLAVE_ESTADO) || "null");
  } catch {
    return null;
  }
}

// --- Aviso de calidad de los datos ------------------------------------------
// El banner lo decide el propio dataset, no una constante: mientras falte
// trazabilidad o haya filas de prueba, se ve. Cuando los datos estén completos
// desaparece solo.

function mostrarAvisoDatos() {
  const total = IMPLANTES.length;
  const demo = IMPLANTES.filter((i) => i.marca.toUpperCase() === "DEMO").length;
  const sinPagina = IMPLANTES.filter((i) => !i.pagina).length;
  const partes = [];

  if (demo) {
    partes.push(`<strong>${demo} de ${total} filas son ficticias</strong>
      (marca DEMO) y no corresponden a ningún producto real.`);
  }
  if (sinPagina) {
    partes.push(`${sinPagina === total ? "Los datos no tienen" : `${sinPagina} filas no tienen`}
      referencia de catálogo ni página, así que una medida no se puede
      contrastar contra su origen.`);
  }

  if (!partes.length) return;
  el.avisoDemoTexto.innerHTML =
    partes.join(" ") + " Contrasta cada medida antes de usarla en planificación.";
  el.avisoDemo.hidden = false;
}

// --- Arranque ---------------------------------------------------------------

function iniciar() {
  const previo = leerEstado();
  iniciarRangoVolumen();

  const marcas = unicos("marca");
  el.listaMarcas.innerHTML = marcas.map((m) => {
    const marcada = !previo || !previo.marcas ? true : previo.marcas.includes(m);
    return `<label class="chip">
      <input type="checkbox" value="${m}"${marcada ? " checked" : ""}> ${m}
    </label>`;
  }).join("");

  for (const s of unicos("superficie")) {
    el.superficie.add(new Option(cap(s), s));
  }

  if (previo) {
    el.base.value = previo.base ?? el.base.value;
    el.tolerancia.value = previo.tolerancia ?? el.tolerancia.value;
    if (previo.volMin) el.volMin.value = previo.volMin;
    if (previo.volMax) el.volMax.value = previo.volMax;
    el.proyeccion.value = previo.proyeccion ?? "";
    el.forma.value = previo.forma ?? "";
    el.altura.value = previo.altura ?? "";
    el.superficie.value = previo.superficie ?? "";
    el.orden.value = previo.orden ?? "cercania";
  }

  mostrarAvisoDatos();

  // Las casillas de comparar viven dentro de los resultados, que se rehacen en
  // cada búsqueda, así que se escuchan desde el contenedor.
  el.resultados.addEventListener("change", (ev) => {
    const casilla = ev.target.closest("input[data-id]");
    if (casilla) alternarComparacion(casilla.dataset.id);
  });

  el.limpiarComparacion.addEventListener("click", () => {
    seleccion = [];
    buscar();
  });

  for (const [campo, cual] of [[el.volMin, "min"], [el.volMax, "max"]]) {
    campo.addEventListener("input", () => ajustarAsas(cual));
  }

  document.querySelector(".panel").addEventListener("input", buscar);
  buscar();
}

iniciar();

</script>
</body>
</html>
